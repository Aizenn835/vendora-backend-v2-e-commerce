spring.application.name=vendora

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/vendora
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Jpa/Hibernate connection
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT Configuration
jwt.secret.key=${JWT_SECRET_KEY}
jwt.expiration=86400000

# Image Configuration
app.upload.dir=./uploads

# Default Profile for user and seller
app.default.pfp=/uploads/user-profile/default-pfp.jpg


# Data Seeder
spring.profiles.active=dev

#Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true